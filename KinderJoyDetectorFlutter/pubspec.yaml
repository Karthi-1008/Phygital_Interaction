name: kinder_joy_detector_flutter
description: Offline YOLO11n Toy Detector and 3D AR Overlay app in Flutter for Android & iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera & Hardware
  camera: ^0.10.5+9
  permission_handler: ^11.3.1

  # Machine Learning / ONNX Runtime
  onnxruntime: ^1.2.0

  # 3D GLB Model Viewer
  flutter_3d_controller: ^1.3.0

  # Utility & UI
  vector_math: ^2.1.4
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/exp-3.onnx
    - assets/models/harry_potter.glb
    - assets/models/hermione.glb
    - assets/models/batman.glb
    - assets/models/flash.glb
