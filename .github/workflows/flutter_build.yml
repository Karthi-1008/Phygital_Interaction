name: Build Native Android Kotlin APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-native-apk:
    name: Build Native Android Release APK (Kotlin + CameraX + ONNX + Filament 3D Engine)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: |
          cd KinderJoyDetector
          chmod +x gradlew

      - name: Build Native Release APK
        run: |
          cd KinderJoyDetector
          ./gradlew assembleRelease --stacktrace

      - name: Upload Native Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinder-joy-native-kotlin-apk
          path: KinderJoyDetector/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
