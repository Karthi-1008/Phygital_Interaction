plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.madrasmindworks.kinderjoydetector'
    compileSdk 34

    defaultConfig {
        applicationId "com.madrasmindworks.kinderjoydetector"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // minSdk 21 already gets native multi-dex support from the platform,
        // so the multidex support library isn't needed here (removed below).

        // ONNX Runtime + Filament each ship a separate native .so per ABI.
        // Shipping all 4 ABIs roughly quadruples that native-lib weight.
        // arm64-v8a alone covers ~99% of active devices (Android 8+), so
        // we build for that only. Add "armeabi-v7a" back only if you must
        // support very old 32-bit devices — it will cost several extra MB.
        ndk {
            abiFilters "arm64-v8a"
        }

        // Strip unused locale strings pulled in transitively by AndroidX
        // libraries (material, appcompat ship ~70 languages of strings).
        resConfigs "en"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign with debug key for easy testing — replace with your keystore for production
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    // Package ONNX model uncompressed (compressing/decompressing a 30MB+
    // model at load time wastes both APK space savings and startup time)
    aaptOptions {
        noCompress "onnx"
    }

    // ABI splits for smaller APK sizes per architecture
    splits {
        abi {
            enable false  // Set true to generate per-ABI APKs; false for universal APK
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            universalApk true
        }
    }

    // Packaging options
    packagingOptions {
        jniLibs {
            pickFirsts += ["**/libc++_shared.so"]
            useLegacyPackaging = false
        }
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE*",
                "META-INF/NOTICE*",
                "META-INF/*.kotlin_module",
                "META-INF/*.version",
                "**/*.proto",
                "kotlin/**",
                "DebugProbesKt.bin"
            ]
        }
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX — latest stable
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ONNX Runtime for Android — GPU + CPU execution providers
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
}
